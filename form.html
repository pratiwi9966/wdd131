<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131-Dynamic Web Fundamentals - Product Review Form">
    <meta name="author" content="Wei-Ling Sun">
    <title>Product Review</title>


    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-small.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html" class="reviewForm">

        <!-- Product Name -->
        <label for="productSelect"><strong>Product Name</strong></label>
        <select id="productSelect" name="ProductSelect" required>
            <option value="" disabled selected>Select a Product...</option>
        </select>

        <!-- Overall Rating -->
         <fieldset>
            <legend><strong>Overall Rating</strong></legend>
              <input type="radio" id="radio1" name="rating" value="1" required><label for="radio1" class="rating-star"> ⭐</label>
              <input type="radio" id="radio2" name="rating" value="2" required><label for="radio2" class="rating-star"> ⭐⭐</label>
              <input type="radio" id="radio3" name="rating" value="3" required><label for="radio3" class="rating-star"> ⭐⭐⭐</label>
              <input type="radio" id="radio4" name="rating" value="4" required><label for="radio4" class="rating-star"> ⭐⭐⭐⭐</label>
              <input type="radio" id="radio5" name="rating" value="5" required><label for="radio5" class="rating-star"> ⭐⭐⭐⭐⭐</label>
         </fieldset>

        <!-- Date of Installation -->
         <label for="CompleteDate"><strong>Date of Installation</strong> <input type="date" id="CompleteDate" name="CompleteDate" required></label>

        <!-- Useful Features -->
         <fieldset>
              <legend><strong>Which features did you find useful in the product?</strong>
                <em>(Check all that apply)</em></legend>
              <input type="checkbox" id="checkbox1" name="features" value="durability"><label for="checkbox1" class="checkbox"> Durability</label>
              <input type="checkbox" id="checkbox2" name="features" value="easeOfUse"><label for="checkbox2" class="checkbox"> Ease Of Use</label>
              <input type="checkbox" id="checkbox3" name="features" value="performance"><label for="checkbox3" class="checkbox"> Performance</label>
              <input type="checkbox" id="checkbox4" name="features" value="design"><label for="checkbox4" class="checkbox"> Design</label>  
         </fieldset>

        <!-- Written Review -->
          <label for="reviewText"><strong>Written Review </strong><em>(Optional)</em></label>
          <textarea id="reviewText" name="reviewText"></textarea>

        <!-- User Name -->
         <label for="userName"><strong>Your Name</strong> <em>(Optional)</em></label>
         <input type="text" id="userName" name="userName">

        <!-- Submit Button -->
        <input type="submit" value="Post Review"> 
      </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="currentYear"></span> 🍂 WeiLing Sun 🍂 Fruit Heights UT</p>
        <p id="lastModified"></p>
    </footer>
    
  </body>
</html>
