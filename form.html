<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131-Dynamic Web Fundamentals - Product Review Form">
    <title>Product Review</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-small.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html" class="reviewForm">

        <!-- Product Name -->
        <label><strong>Product Name</strong> 
        <select id="productSelect" name="ProductSelect" required>
            <option value="">Choose a Product...</option>
            <!-- <option value="AquaBloom Watercolor Set">AquaBloom Watercolor Set</option>
            <option value="MistyHue Watercolor Palette">MistyHue Watercolor Palette</option>
            <option value="ColorWave Artist Kit">ColorWave Artist Kit</option>
            <option value="WaterLuxe Paint Collection">WaterLuxe Paint Collection</option> -->
        </select>
        </label>

        <!-- Overall Rating -->
         <fieldset>
            <legend><strong>Overall Rating</strong></legend>
              <label id="rating-star"><input type="radio" name="rating" value="1" required> ⭐</label>
              <label id="rating-star"><input type="radio" name="rating" value="2" required> ⭐⭐</label>
              <label id="rating-star"><input type="radio" name="rating" value="3" required> ⭐⭐⭐</label>
              <label id="rating-star"><input type="radio" name="rating" value="4" required> ⭐⭐⭐⭐</label>
              <label id="rating-star"><input type="radio" name="rating" value="5" required> ⭐⭐⭐⭐⭐</label>
         </fieldset>

        <!-- Date of Installation -->
         <label><strong>Date of Installation</strong> <input type="date" name="CompleteDate" required></label>

        <!-- Useful Features -->
         <fieldset>
              <legend><strong>Which features did you find useful in the product?</strong></legend>
                <em>(Check all that apply)</em></le>
              <label id="checkbox"><input type="checkbox" name="features" value="durability"> Durability</label>
              <label id="checkbox"><input type="checkbox" name="features" value="easeOfUse"> Ease Of Use</label>
              <label id="checkbox"><input type="checkbox" name="features" value="performance"> Performance</label>
              <label id="checkbox"><input type="checkbox" name="features" value="design"> Design</label>  
         </fieldset>

        <!-- Written Review -->
          <label><strong>Written Review </strong><em>(Optional)</em></label>
          <textarea id="reviewText" name="reviewText"></textarea>

        <!-- User Name -->
         <label><strong>Your Name</strong> <em>(Optional)</em></label>
         <input type="text" id="userName" name="userName">

        <!-- Submit Button -->
        <input type="submit" value="Post Review"> 
      </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="currentYear"></span> 🍂 WeiLing Sun 🍂 Fruit Heights UT</p>
        <p id="lastModified"></p>
    </footer>
    
  </body>
</html>
