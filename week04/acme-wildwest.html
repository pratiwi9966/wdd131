<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ACME Wildwest</title>
        <link rel="stylesheet" href="acme-wildwest.css">
    </head>
    
    <body>
        <table>
            <!--<thead></thead>:放表格標題與欄位名稱-->
            <thead>
                <tr>
                    <!--<th colspan="4"></th>: 跨 4 欄-->   
                    <th colspan="4">ACME Wildwest Services</th>
                </tr>
                <tr>
                    <!--.blank：讓那格變黑色，用來製造空白欄。-->
                    <td class="blank"></td>
                    <th>Basic</th>
                    <th>Premium</th>
                    <th>Deluxe</th>
                </tr>
            </thead>

            <!--<tbody></tbody>:放數據（每個功能與方案的打勾/打叉）-->
            <tbody>
                <tr>
                    <th>Feature 1</th>
                    <td>✔️</td>
                    <td>✔️</td>
                    <td>✔️</td>
                </tr>

                <tr>
                    <th>Feature 2</th>
                    <td>❌</td>
                    <td>✔️</td>
                    <td>✔️</td>
                </tr>
                
                <tr>
                    <th>Feature 3</th>
                    <td>❌</td>
                    <td>❌</td>
                    <td>✔️</td>
                </tr>
            </tbody>

            <!--<caption></caption>:表格標題，位置會被 CSS 設定為底部。-->
            <caption>Table 1: Account Feature Comparison</caption>
        </table>
    </body>
</html>
