<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lazy Load</title>

        <link rel="stylesheet" href="styles/lazyload.css">
         <script src="scripts/lazyload.js" defer></script>
    </head>

    <body>
        <main>
            <h1>Orchid Island - Taiwan  Pictures</h1>
            <figure>
                <img src="images/alive-flying-fish.webp" 
                alt="alive flying fish flying on the ocean" loading="lazy" with="500" height="250">
                <figcaption>Alive Flying Fish</figcaption>
            </figure>
            <figure>
                <img src="images/dried-flying-fish.webp" 
                alt="Hanging Dried Flying Fish" loading="lazy" with="500" height="250">
                <figcaption>Dried Flying Fish</figcaption>
            </figure>
            <figure>
                <img src="images/cooked-flying-fish.webp" 
                alt="Cooked Flying Fish" bloading="lazy" with="500" height="250">
                <figcaption>Cooked Flying Fish</figcaption>
            </figure>
            <figure>
                <img src="images/taro.webp" alt="Cooked Sweet Taro" 
                loading="lazy" with="500" height="250">
                <figcaption>Sweet Taro</figcaption>
            </figure>
            <figure>
                <img src="images/tao-totem.webp" alt="Tao Tripe Totem Art" 
                loading="lazy" with="500" height="250">
                <figcaption>Tao Tripe Totem Art</figcaption>
            </figure>
            <figure>
                <img src="images/orchid-island-small.webp" 
                alt="Traditional Tao People Boat" loading="lazy" with="500" height="250">
                <figcaption>Traditional Tao People Boat</figcaption>
            </figure>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> 🍂 WeiLing Sun 🍂 Fruit Heights UT</p>
            <p id="lastModified"></p>
        </footer>
        
    </body>

</html>
