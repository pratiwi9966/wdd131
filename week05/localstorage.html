<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage</title>
    <!--CSS-->
    <link rel="stylesheet" href="localstorage.css">
    <!--JS-->
    <script src="localstorage.js" defer></script>
  </head>

  <body>
    <main>
      <h1>⚙️ Using localStorage</h1>
      <p>This demonstration page keeps track of the total number of visits by a user 
        agent (client) on a single page utilizing the localStorage option of the Web Storage API.</p>
      <p>localStorage stores string values in key-value pairs.</p>

      <!--The first <span> shows the label text.-->
      <!--The second <span class="visits"> is empty at first — 
        this is where JavaScript will insert the number of visits.-->
      <p><span class="label">Number of Visits: </span><span class="visits"></span></p>
    </main>

  </body>
</html>
